<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=960, initial-scale=1" />
  <title>Seif Ayman — Japanese blue profile banner</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 960px; height: 300px; margin: 0; overflow: hidden; background: #060b12; }
    body { color: #f4f8ff; font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .poster { position: relative; width: 960px; height: 300px; overflow: hidden; border: 1px solid rgba(127, 196, 255, .34); border-radius: 18px; background: #07101c; box-shadow: 0 0 28px rgba(82, 176, 255, .12), inset 0 0 44px rgba(16, 36, 61, .4); }
    .landscape { position: absolute; z-index: 0; inset: -12px; background: url("hero-landscape.jpg") center 53% / cover no-repeat; filter: saturate(.8) brightness(.8); transform: scale(1.05); }
    .veil { position: absolute; z-index: 1; inset: 0; background: linear-gradient(90deg, rgba(5, 10, 18, .94) 0%, rgba(7, 14, 24, .87) 42%, rgba(8, 18, 32, .27) 70%, rgba(5, 11, 19, .34) 100%), linear-gradient(0deg, rgba(5, 11, 19, .63), transparent 45%); }
    .skyline-glow { position: absolute; z-index: 1; right: 7%; top: -62px; width: 320px; height: 240px; border-radius: 50%; background: rgba(64, 158, 255, .22); filter: blur(74px); animation: glow 4s ease-in-out infinite; }
    .grain { position: absolute; z-index: 4; inset: 0; pointer-events: none; opacity: .13; background: repeating-linear-gradient(0deg, transparent 0, transparent 3px, rgba(179, 222, 255, .15) 4px, transparent 5px); }
    .topline { position: absolute; z-index: 5; left: 40px; right: 40px; top: 24px; display: flex; align-items: center; justify-content: space-between; color: #a8b8cc; font: 700 9px/1.2 "DejaVu Sans Mono", Consolas, monospace; letter-spacing: 2px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark { color: #83caff; font-size: 14px; text-shadow: 0 0 14px rgba(110, 190, 255, .7); }
    .availability { display: flex; align-items: center; gap: 8px; padding: 7px 11px; border: 1px solid rgba(134, 199, 255, .27); border-radius: 30px; color: #d6ecff; background: rgba(6, 20, 36, .69); letter-spacing: 1px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #7fc7ff; box-shadow: 0 0 10px #73beff; animation: pulse 2s ease-in-out infinite; }
    .copy { position: absolute; z-index: 3; left: 43px; top: 65px; width: 567px; text-shadow: 0 2px 16px rgba(0, 0, 0, .64); }
    .eyebrow { display: flex; align-items: center; gap: 8px; color: #9bb1c9; font: 700 9px/1.2 "DejaVu Sans Mono", Consolas, monospace; letter-spacing: 2.5px; }
    .eyebrow .signal { width: 6px; height: 6px; border-radius: 50%; background: #83caff; box-shadow: 0 0 11px #83caff; animation: pulse 2s ease-in-out infinite; }
    h1 { margin: 11px 0 7px; font-size: 47px; line-height: .91; letter-spacing: -1.9px; font-weight: 850; }
    h1 .first { display: block; color: #f4f8ff; }
    h1 .last { display: block; color: #72bcff; text-shadow: 0 0 22px rgba(69, 157, 255, .32); }
    .jp-line { margin: 10px 0 6px; color: #e5f2ff; font-size: 11px; letter-spacing: .7px; }
    .summary { margin: 0; max-width: 475px; color: #afbdcf; font-size: 10px; line-height: 1.45; }
    .chips { display: flex; gap: 7px; margin-top: 10px; }
    .chip { padding: 5px 8px; border: 1px solid rgba(134, 198, 255, .26); border-radius: 4px; color: #d5ebff; background: rgba(10, 25, 43, .72); font: 700 8px/1 "DejaVu Sans Mono", Consolas, monospace; letter-spacing: .65px; }
    .chip.primary { color: #e8f6ff; border-color: rgba(127, 194, 255, .47); background: rgba(39, 111, 171, .28); }
    .portrait-wrap { position: absolute; z-index: 2; right: 58px; bottom: -48px; width: 270px; height: 360px; overflow: hidden; filter: drop-shadow(0 0 26px rgba(68, 156, 255, .18)); animation: float 4s ease-in-out infinite; }
    .portrait { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; opacity: .98; }
    .portrait-light { position: absolute; z-index: 1; right: 88px; bottom: -105px; width: 230px; height: 230px; border-radius: 50%; background: rgba(59, 153, 255, .22); filter: blur(75px); animation: glow 4s ease-in-out infinite; }
    .samurai { position: absolute; z-index: 5; right: 28px; top: 74px; color: rgba(224, 242, 255, .82); font: 700 12px/1.2 "DejaVu Sans Mono", Consolas, monospace; letter-spacing: 5px; writing-mode: vertical-rl; text-shadow: 0 0 12px rgba(128, 195, 255, .35); }
    .terminal { position: absolute; z-index: 5; right: 42px; bottom: 17px; width: 265px; height: 34px; display: flex; align-items: center; gap: 7px; padding: 0 9px; border: 1px solid rgba(137, 198, 255, .29); border-radius: 5px; background: rgba(5, 13, 23, .84); color: #bfd3e7; font: 8px/1.2 "DejaVu Sans Mono", Consolas, monospace; backdrop-filter: blur(6px); }
    .prompt { color: #86c9ff; }
    .command { display: inline-block; width: 0; overflow: hidden; white-space: nowrap; color: #edf7ff; animation: type 4s steps(22, end) infinite; }
    .cursor { flex: none; width: 5px; height: 9px; background: #86c9ff; animation: blink 1s steps(1) infinite; }
    .jp-seal { position: absolute; z-index: 4; right: 313px; top: 26px; color: rgba(159, 207, 249, .37); font-size: 16px; writing-mode: vertical-rl; letter-spacing: 4px; }
    .accent-line { position: absolute; z-index: 5; left: 43px; bottom: 10px; width: 518px; height: 1px; background: linear-gradient(90deg, rgba(123, 195, 255, .7), rgba(123, 195, 255, .18), transparent); transform-origin: left; animation: line 4s ease-in-out infinite; }
    .accent-line::after { content: ""; position: absolute; left: 0; top: -1px; width: 42px; height: 3px; background: #8bcfff; border-radius: 4px; filter: blur(2px); animation: travel 4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity: .68; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes pulse { 0%,100% { opacity: .58; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.17); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes type { 0%,10% { width: 0; } 60%,81% { width: 150px; } 100% { width: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes line { 0%,100% { opacity: .48; } 50% { opacity: 1; } }
    @keyframes travel { 0%,100% { left: 0; } 50% { left: 91%; } }
  </style>
</head>
<body>
  <main class="poster">
    <div class="landscape"></div>
    <div class="veil"></div>
    <div class="skyline-glow"></div>
    <header class="topline">
      <div class="brand"><span class="brand-mark">◈</span><span>THESEIFDEV&nbsp; / &nbsp;侍 ENGINEER</span></div>
      <div class="availability"><span class="status-dot"></span> OPEN TO REMOTE</div>
    </header>
    <section class="copy">
      <div class="eyebrow"><span class="signal"></span> SENIOR FULL STACK DEVELOPER</div>
      <h1><span class="first">SEIF</span><span class="last">AYMAN</span></h1>
      <div class="jp-line">テクノロジーで、より良い未来をつくる。</div>
      <p class="summary">I build production web, desktop and AI products—from typed interfaces to APIs and data models.</p>
      <div class="chips"><span class="chip primary">5+ YEARS BUILDING</span><span class="chip">WEB / AI / IOT</span><span class="chip">ALEXANDRIA, EGYPT</span></div>
    </section>
    <div class="portrait-wrap"><img class="portrait" src="seif-portrait.webp" alt="" /></div>
    <div class="portrait-light"></div>
    <div class="jp-seal">サムライ</div>
    <div class="terminal"><span class="prompt">$</span><span class="command">build --design --ship</span><span class="cursor"></span><span style="margin-left:auto;color:#8fcaff">● LIVE</span></div>
    <div class="accent-line"></div>
  </main>
</body>
</html>
